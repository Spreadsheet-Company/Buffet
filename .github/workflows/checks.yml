# The checks, on every push to main and every pull request, in Alonzo's
# shape, two jobs. The ratchets job runs tools/run_checks.ps1 under Windows
# PowerShell 5.1, the house's floor for every check, with the floor on the
# count and the controls that prove each check on mutants (HOUSE.1). The
# crate job builds, formats, lints and tests the workspace over the engine
# and the language from crates.io, every cargo step that resolves held to the
# committed Cargo.lock and its checksums by --locked (rustfmt reads no lock
# and refuses the flag), and builds the engine's module from the registry
# crate for the browser under the workspace's release profile, as the page
# will carry it (HOUSE.2, HOUSE.4). The oracle crate's tests are where the
# game is held: the cartridge loaded through the engine, held to its source
# expanded and to its describe golden, and every frame held to the game
# written by hand (MISE.2). What Alonzo's crate job runs and this one does
# not, until Buffet has it: the package's own tests from its tarball (the
# oracle is never published), the frames runner (MISE.4's floors) and the
# page (HOUSE.4). The actions are at their Node 24 majors, v7.
name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ratchets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: every tools/check_*.ps1 under Windows PowerShell 5.1, the floor and the controls
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools/run_checks.ps1 -WithExtras
          exit $LASTEXITCODE
  crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: build, format-check, lint and test the workspace over the engine from crates.io, the lock held (HOUSE.2)
        run: |
          cargo build --workspace --locked
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: build the engine's module from the registry crate, as the page will carry it (HOUSE.4)
        run: cargo build --release --locked -p alonzo --target wasm32-unknown-unknown
