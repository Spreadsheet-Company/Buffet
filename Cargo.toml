# The Cargo workspace: the oracle, one member. The game itself is a
# cartridge, rows the engine loads, and no crate; what the workspace holds is
# the game written a second time by hand, the runners that play it and the
# tests that hold every frame of the cartridge to it (docs/OMAKASE.md, MISE.2),
# all of it over the engine and the language consumed from crates.io and
# never copied here, as a stranger consumes them.
#
# The pins are exact and never a range, and a registry version and never a
# git rev (the owner's route, 2026-10-14): alonzo 0.5.0, the release whose page
# goes on as a game went from a save or kept work opened where its Write sheet
# waits, an order's rows waiting among them (Alonzo's ENGINE.30, decision 13, at
# Buffet's ask), copies, cuts and pastes in the grid (ENGINE.39) and saves a
# file a cartridge reads into the file opened (CART.16, ENGINE.49), and whose
# kit gains the Format sheet's verb (file-lines); beside 0.4.0's save and open
# (ENGINE.5), a run's unsaved work kept through a closed tab (ENGINE.38,
# ENGINE.40), a sheet's conditional formats drawn (ENGINE.37), the last act's
# answer in the bar (ENGINE.42), the region shown the region seen (ENGINE.43)
# and a put's pieces by name (KIT.6); 0.3.0's formats drawn (ENGINE.28) and
# version 6, the sheets whose keys are the game's and those no person writes
# (SPEC.5), 0.2.0's palette and a cartridge's own commands (ENGINE.22 to
# ENGINE.25), 0.1.5's edit and continue (ENGINE.7) and 0.1.4's views on a game's
# own sheets (ENGINE.18); and vla-lang 0.15.0, the version that release pins, so
# that the lock holds one copy of the language: a cell given back to no value as
# Excel's ClearContents does (Frazaro's KERNEL.46), dynamic arrays whole
# (KERNEL.55), a cell alone read in place (KERNEL.74), functions at expand time
# (VLA.8) and a source's parameters (VLA.11), over 0.14.0's LET and LAMBDA
# (KERNEL.29), the information functions, ERROR.TYPE among them (KERNEL.68), a
# sheet's rules (KERNEL.58) and a macro's named pieces (VLA.9), 0.12.0's formula
# cell in about 14 to 19 bytes (KERNEL.49), the library's second slice
# (KERNEL.8), a format's looks (KERNEL.50) and the expander's loops and names
# (VLA.5, VLA.6 and VLA.15), every answer the same to the bit. Both resolve from crates.io since alonzo 0.1.0, the engine's first
# release, was published (2026-10-14): the local patch that stood in for it is
# deleted, and Cargo.lock is committed (HOUSE.2). What this repository copies from the
# engine's, the kit and the page, is copied at the tag this pin names, and
# tools/check_vendored.ps1 fails when the pin moves without the copies
# (HOUSE.4).

[workspace]
resolver = "2"
members = ["oracle"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Spreadsheet-Company/Buffet"

[workspace.dependencies]
alonzo = "=0.5.0"
vla-lang = "=0.15.0"

[profile.dev.package."*"]
# The engine and the language, every package that is not the workspace's,
# compiled optimized in the dev profile, the one cargo test builds: the
# suite's time goes to the engine stepping and viewing its sheets, which an
# unoptimized build makes the dearest thing the tests do (STATION.1), and
# not to the hand. The oracle crate stays unoptimized, so the hand runs as
# it is written and an edit of it rebuilds as quickly as before. Debug
# assertions and overflow checks stay on, the profile's own. Rust never
# contracts floating point, and the engine's sine and power are the
# platform's library calls on a cell's value, so the engine optimized and
# the hand unoptimized agree to the bit, which the tests hold at every
# frame. Measured 2026-10-15 on the owner's machine, alternated against the
# commit before: the warm suite 7.5 s became 3.7 s; from an empty target
# folder the build took 8.3 s where it took 4.3, about 12.3 s to a green
# suite either way; an edit of the oracle rebuilt in about a second either
# way. Alonzo optimizes its whole dev profile in CI alone (its checks.yml);
# here the manifest holds it, so every machine's runs gain.
opt-level = 3

[profile.release]
# Alonzo's own release profile, copied so that a build of the engine's
# module from this workspace (cargo build --release -p alonzo --target
# wasm32-unknown-unknown, for the page, HOUSE.4) keeps its import section
# empty: a panic aborts, so the module imports nothing to unwind with. A
# module built from the crate takes the building workspace's profile, so the
# game's page reaps the engine's speed only at the engine's own: opt-level 3
# since the pin to alonzo 0.2.0, as Alonzo's since its pin to vla-lang 0.10.0,
# the browser's frames and loads about a tenth faster than at "s" for a module
# about a fifth larger (Alonzo's RELEASES.md, 0.2.0).
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
strip = true
